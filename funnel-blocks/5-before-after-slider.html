<!-- Evolve Omega: before/after slider. Paste into a GHL Custom Code element.
     Put real, approved images in data-before and data-after (Danno's own, or approved Proof Bank items), and describe each in data-alt-*.
     Until then the two panes show placeholders. Never use an invented result. -->
<figure class="eo-ba" data-before="[BEFORE IMAGE URL]" data-after="[AFTER IMAGE URL]" data-alt-before="[Describe the before image]" data-alt-after="[Describe the after image]">
<style>
.eo-ba,.eo-ba *{box-sizing:border-box}
.eo-ba{position:relative;max-width:900px;margin:0 auto;aspect-ratio:4/3;overflow:hidden;border:1px solid #3a2d18;border-radius:16px;background:#0b0703;font-family:"DM Sans",Arial,sans-serif;--p:50%}
.eo-ba-b,.eo-ba-a{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#a8987f;font-size:15px;text-align:center;padding:16px}
.eo-ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.eo-ba-b{padding-right:52%}.eo-ba-a{padding-left:52%}
.eo-ba-a{clip-path:inset(0 0 0 var(--p));background:#120c05}
.eo-ba-a.eo-k{transition:clip-path .25s ease}
.eo-ba span{position:absolute;top:12px;padding:4px 10px;border-radius:999px;background:rgba(3,1,0,.75);color:#F6F1E7;font-size:12px;letter-spacing:.08em;text-transform:uppercase;pointer-events:none}
.eo-ba-l{left:12px}.eo-ba-r{right:12px}
.eo-ba-h{position:absolute;top:0;bottom:0;left:var(--p);width:2px;margin-left:-1px;background:#DDA338;pointer-events:none}
.eo-ba-h::after{content:"\2039\00a0\203A";position:absolute;top:50%;left:50%;display:grid;place-items:center;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:#DDA338;color:#030100;font-size:20px;font-weight:700}
.eo-ba input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize;touch-action:pan-y}
.eo-ba input:focus-visible~.eo-ba-h::after{outline:2px solid #F6F1E7;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.eo-ba-a.eo-k{transition:none}}
</style>
<div class="eo-ba-b"></div><div class="eo-ba-a"></div>
<span class="eo-ba-l">Before</span><span class="eo-ba-r">After</span>
<input type="range" min="0" max="100" value="50" aria-label="Compare before and after: move left for more after, right for more before">
<div class="eo-ba-h"></div>
<script>
(function(f){var d=f.dataset,r=f.querySelector("input"),a=f.querySelector(".eo-ba-a");
[["b",d.before,d.altBefore],["a",d.after,d.altAfter]].forEach(function(x){var el=f.querySelector(".eo-ba-"+x[0]);
if(/^\[/.test(x[1])){el.textContent=x[1]}else{var i=new Image();i.src=x[1];i.alt=x[2];i.loading="lazy";el.appendChild(i)}});
function set(){f.style.setProperty("--p",r.value+"%")}
r.addEventListener("input",set);
r.addEventListener("keydown",function(){a.classList.add("eo-k")});
r.addEventListener("pointerdown",function(){a.classList.remove("eo-k")});
set();
})(document.currentScript.closest(".eo-ba"));
</script>
</figure>
