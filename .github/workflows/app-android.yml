# The Android app (H-626 Phase 2, plan H-877): builds the signed bundle (.aab). Started by hand only; it never sends
# anything to production. The bundle is always saved on the run for download (Google needs the very first upload done by
# hand in Play Console); once PLAY_SERVICE_ACCOUNT_JSON is set, later runs also upload to the track chosen below.
name: Android app → Play testing

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Site the app opens (leave as is for the live site; a Vercel Preview URL for a test build)"
        required: true
        default: "https://helixos.evolveomega.com"
      track:
        description: "Play testing track to upload to (needs PLAY_SERVICE_ACCOUNT_JSON)"
        required: true
        default: "internal"
        type: choice
        options: [internal, beta]

permissions:
  contents: read

jobs:
  bundle:
    # Pinned: ubuntu-latest moved to a new image on 19 Oct and its SDK setup stalled on licence prompts (H-1595).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HELIXOS_APP_URL: ${{ inputs.app_url }}
      HELIXOS_VERSION_CODE: ${{ github.run_number }}
      HELIXOS_VERSION_NAME: "1.0"
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The image's own Android SDK: accept every licence without a prompt, then add what the app compiles against.
      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install and sync the shell
        working-directory: mobile
        run: npm ci && npx cap sync android

      - name: Upload key and Firebase config (from secrets, removed after the run)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > mobile/android/app/google-services.json; fi

      - name: Build the signed bundle
        working-directory: mobile/android
        env:
          HELIXOS_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.p12
          HELIXOS_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          HELIXOS_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          HELIXOS_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: ./gradlew --no-daemon bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: helixos-android-${{ github.run_number }}
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload to Play testing
        if: ${{ env.HAS_PLAY_KEY == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.evolveomega.helixos
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: completed

      - name: Remove the keys
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.p12" mobile/android/app/google-services.json
