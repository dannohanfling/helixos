# The iPhone app (H-626 Phase 2, plan H-877): builds, signs and uploads to TestFlight. Started by hand only; it never
# submits for App Store review. Signing uses Danno's App Store Connect API key from GitHub secrets, never the repo.
name: iPhone app → TestFlight

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Site the app opens (leave as is for the live site; a Vercel Preview URL for a test build)"
        required: true
        default: "https://helixos.evolveomega.com"

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HELIXOS_APP_URL: ${{ inputs.app_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install and sync the shell
        working-directory: mobile
        run: npm ci && npx cap sync ios

      - name: App Store Connect key (from secrets, removed after the run)
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/key.p8"

      - name: Archive
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/HelixOS.xcarchive" \
            DEVELOPMENT_TEAM='${{ secrets.APPLE_TEAM_ID }}' CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION='${{ github.run_number }}' MARKETING_VERSION=1.0 \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8" \
            -authenticationKeyID '${{ secrets.ASC_KEY_ID }}' \
            -authenticationKeyIssuerID '${{ secrets.ASC_ISSUER_ID }}' \
            archive

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/HelixOS.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8" \
            -authenticationKeyID '${{ secrets.ASC_KEY_ID }}' \
            -authenticationKeyIssuerID '${{ secrets.ASC_ISSUER_ID }}'

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
