<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="robots" content="noindex">
<title>Offline · HelixOS</title>
<style>
  /* Dark like the logo screen (H-1813), so nothing flashes light between them. */
  :root { color-scheme: dark; --bg: #111318; --ink: #f2f1ec; --ink-2: #b9bcc4; --gold: #DDA338; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { width: 100%; max-width: 340px; }
  /* The Golden hour medallion, as on the logo screen (H-1966), its glow fading into the Night background. */
  .mark { display: block; width: 200px; height: 200px; margin: 0 auto 24px;
    -webkit-mask-image: radial-gradient(circle, #000 58%, transparent 71%); mask-image: radial-gradient(circle, #000 58%, transparent 71%); }
  h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -0.01em; }
  p { margin: 0 0 24px; color: var(--ink-2); }
  /* The one thing to do here: a full-width gold button (H-1794). */
  button { display: block; width: 100%; min-height: 52px; padding: 0 22px; border-radius: 12px; border: 0; background: var(--gold); color: #111318;
    font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:active { filter: brightness(0.92); }
  button[disabled] { opacity: 0.7; }
</style>
</head>
<body>
<main>
  <img class="mark" src="golden-medallion.webp" width="200" height="200" alt="">
  <h1>You're offline</h1>
  <p>HelixOS will be back when your connection is. Nothing you saved is lost.</p>
  <button type="button" id="again">Try again</button>
</main>
<script>(function () { try { var s = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen; if (s) s.hide(); } catch (e) {} })();</script>
<script>
  (function () {
    var b = document.getElementById("again");
    function again() {
      b.disabled = true;
      b.textContent = "Trying again…";
      location.href = "https://helixos.evolveomega.com/today";
      // Still here after 15 s (a very slow line): the button comes back.
      setTimeout(function () { b.disabled = false; b.textContent = "Try again"; }, 15000);
    }
    b.addEventListener("click", again);
    // Back on its own when the phone reconnects.
    window.addEventListener("online", again);
  })();
</script>
</body>
</html>
