<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rank-up ceremony</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#100D09}
a{color:#F0CF86}a:hover{color:#F1E6CF}
.ph{position:relative;width:390px;height:844px;border-radius:40px;overflow:hidden;outline:1px solid #3A3022;background:radial-gradient(ellipse 120% 60% at 50% 18%,rgba(212,174,90,.2),rgba(212,174,90,0) 60%),#100D09;color:#F1E6CF;font-family:Manrope,"Segoe UI",system-ui,sans-serif}
.skip{position:absolute;z-index:5;top:16px;right:16px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(241,230,207,.4);background:rgba(16,13,9,.6);color:#F1E6CF;font:700 13px/1 Manrope,sans-serif;letter-spacing:1.5px;cursor:pointer}
.col{position:absolute;left:16px;right:16px;top:76px;bottom:20px;display:flex;flex-direction:column;gap:18px}
.win{position:relative;width:358px;height:201px;border-radius:14px;padding:3px;box-sizing:border-box;background:linear-gradient(180deg,#FBE7A6 0%,#E8C26A 30%,#C9973F 62%,#9A6526 100%);box-shadow:0 6px 24px rgba(0,0,0,.5);animation:rise .5s ease .15s both}
.win-in{position:relative;width:100%;height:100%;border-radius:11px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#2A1F14,#0B0805 80%)}
.torch{position:absolute;top:20%;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,170,80,.45),rgba(255,170,80,0) 65%);animation:tflick 1.3s ease-in-out infinite}
.torch.l{left:-40px}.torch.r{right:-40px;animation-duration:1.1s;animation-delay:.3s}
.arch{position:absolute;left:50%;bottom:0;width:150px;height:170px;margin-left:-75px;border-radius:75px 75px 0 0;background:linear-gradient(#0A0705,#1D150D);box-shadow:inset 0 0 0 3px rgba(214,190,150,.22)}
.ped{position:absolute;left:50%;bottom:0;width:70px;height:54px;margin-left:-35px;background:linear-gradient(#EADFC9,#A99A80)}
.ped-top{position:absolute;left:50%;bottom:54px;width:86px;height:8px;margin-left:-43px;border-radius:2px;background:linear-gradient(#F4EBD8,#C2B396)}
.rays{position:absolute;left:50%;bottom:20px;width:220px;height:220px;margin-left:-110px;border-radius:50%;background:repeating-conic-gradient(rgba(255,220,150,.2) 0deg 5deg,rgba(255,220,150,0) 5deg 22deg);-webkit-mask-image:radial-gradient(circle,#000 20%,transparent 68%);mask-image:radial-gradient(circle,#000 20%,transparent 68%);animation:fadeIn .8s ease 1.3s both,spin 14s linear 1.3s infinite}
.orb{position:absolute;left:50%;bottom:68px;width:36px;height:36px;margin-left:-18px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFF7DD,#F0CF86 40%,#A87B24 78%);box-shadow:0 0 34px 12px rgba(255,200,110,.5);animation:orbWake 2.2s ease .4s both}
.medal{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#FFF3C8 0%,#F3D47E 16%,#D9AC4E 40%,#B07A2C 68%,#7E501C 100%);box-shadow:inset 0 0 0 3px #8C5A1E,inset 0 0 0 6px rgba(255,236,180,.45),0 8px 26px rgba(0,0,0,.6);animation:stamp .6s cubic-bezier(.3,1.4,.5,1) .3s both;overflow:hidden}
.medal svg{position:absolute;inset:10px;width:100px;height:100px;color:#7A4E1C}
.medal-n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:36px;color:#4A2E0C;text-shadow:0 1px 0 rgba(255,236,180,.6)}
.medal::after{content:"";position:absolute;top:-20%;bottom:-20%;width:40%;left:-70%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,252,230,.85),rgba(255,255,255,0));transform:skewX(-15deg);animation:sweep .8s ease-out .95s both}
.mrays{position:absolute;left:50%;top:50%;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;background:repeating-conic-gradient(rgba(255,220,150,.22) 0deg 4deg,rgba(255,220,150,0) 4deg 20deg);-webkit-mask-image:radial-gradient(circle,#000 25%,transparent 66%);mask-image:radial-gradient(circle,#000 25%,transparent 66%);animation:fadeIn .6s ease .6s both,spin 16s linear .6s infinite}
.eb{font-size:12px;line-height:16px;font-weight:700;letter-spacing:5px;text-transform:uppercase;color:#F0CF86}
.pre{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:24px;line-height:1.1;margin-top:10px}
.rank{margin-top:2px}
.rw{display:inline-block;font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:68px;line-height:1;color:transparent;background:linear-gradient(100deg,rgba(255,255,240,0) 40%,rgba(255,255,240,.95) 50%,rgba(255,255,240,0) 60%),linear-gradient(180deg,#FBE7A6 0%,#E8C26A 38%,#C9973F 68%,#9A6526 100%);background-size:250% 100%,100% 100%;background-position:-60% 0,0 0;background-repeat:no-repeat;-webkit-background-clip:text;background-clip:text;animation:stampTxt .55s cubic-bezier(.3,1.4,.5,1) calc(var(--t) + .3s) both,shineTxt 1s ease-out calc(var(--t) + .85s) both}
.ln{margin:8px 0 0;font-size:15px;line-height:1.5;color:#A7997F}
.a1{animation:rise .45s ease calc(var(--t) + 0s) both}
.a2{animation:rise .45s ease calc(var(--t) + .15s) both}
.a4{animation:rise .45s ease calc(var(--t) + .55s) both}
.a5{animation:rise .45s ease calc(var(--t) + .75s) both}
.a6{animation:rise .45s ease calc(var(--t) + 1.15s) both}
.a7{animation:rise .45s ease calc(var(--t) + 1.4s) both}
.lad{display:flex;flex-direction:column;gap:8px}
.pips{display:flex;align-items:center;justify-content:space-between;position:relative}
.pips::before{content:"";position:absolute;left:8px;right:8px;top:50%;height:1px;background:#3A3022}
.pip{position:relative;width:14px;height:14px;border-radius:50%;box-sizing:border-box}
.pip.done{background:radial-gradient(circle at 32% 28%,#FFF3C8,#D9AC4E 45%,#7E501C);box-shadow:inset 0 0 0 1px #8C5A1E}
.pip.now{width:24px;height:24px;background:radial-gradient(circle at 32% 28%,#FFF3C8,#D9AC4E 45%,#7E501C);box-shadow:inset 0 0 0 1.5px #8C5A1E,0 0 0 2px #100D09,0 0 0 4px #F0CF86,0 0 16px rgba(255,200,110,.55);animation:pop .4s cubic-bezier(.3,1.6,.5,1) calc(var(--t) + 1.0s) both}
.pip.next{background:radial-gradient(circle at 32% 28%,#E2B488,#8C5631 60%,#5E3820);opacity:.4}
.lad-l{display:flex;justify-content:space-between;font-size:11px;line-height:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#A7997F}
.nx{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid #3A3022}
.nx-top{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.nx-top b{font-weight:700}
.nx-go{font-size:13px;color:#A7997F}
.bar{height:6px;border-radius:3px;background:#3A3022}
.fill{height:100%;border-radius:3px;background:#D4AE5A;transform-origin:left center;animation:fillx .6s ease calc(var(--t) + 1.3s) both}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.cta{position:relative;overflow:hidden;min-height:50px;border:1px solid #7A4E1C;border-radius:999px;background:linear-gradient(180deg,#FBE7A6 0%,#E8C26A 30%,#C9973F 62%,#9A6526 100%);color:#3A230A;font:800 14px/1 Manrope,sans-serif;letter-spacing:1.5px;text-transform:uppercase;text-shadow:0 1px 0 rgba(255,240,200,.6);box-shadow:inset 0 1px 0 rgba(255,250,225,.9),inset 0 -2px 0 rgba(90,56,16,.35),0 2px 6px rgba(0,0,0,.35);cursor:pointer}
.cta::before{content:"";position:absolute;top:-30%;bottom:-30%;width:30%;left:-40%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,252,230,.85),rgba(255,255,255,0));transform:skewX(-15deg);animation:sweep2 6s ease-in-out 5s infinite;pointer-events:none}
.sec{min-height:48px;border:1px solid #5E4C27;border-radius:999px;background:transparent;color:#F0CF86;font:700 14px/1 Manrope,sans-serif;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer}
.done *:not(.lv),.done{animation:none !important}
@media (prefers-reduced-motion: reduce){.ph *,.ph,.ph *::before,.ph *::after{animation:none !important}}
.rp{min-height:44px;padding:0 22px;border-radius:999px;border:1px solid #5E4C27;background:transparent;color:#F0CF86;font:700 13px/1 Manrope,sans-serif;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tflick{0%,100%{opacity:.85;transform:scale(1)}30%{opacity:1;transform:scale(1.06)}55%{opacity:.7;transform:scale(.96)}80%{opacity:.95;transform:scale(1.02)}}
@keyframes orbWake{0%{opacity:.15;transform:scale(.4);box-shadow:0 0 0 0 rgba(255,200,110,0)}60%{opacity:1;transform:scale(1.18)}100%{opacity:1;transform:scale(1)}}
@keyframes stamp{0%{opacity:0;transform:scale(2) rotate(-20deg)}60%{opacity:1;transform:scale(.94) rotate(3deg)}100%{opacity:1;transform:none}}
@keyframes stampTxt{0%{opacity:0;transform:scale(1.6)}60%{opacity:1;transform:scale(.96)}100%{opacity:1;transform:none}}
@keyframes shineTxt{from{background-position:150% 0,0 0}to{background-position:-60% 0,0 0}}
@keyframes sweep{from{left:-70%}to{left:130%}}
@keyframes sweep2{0%{left:-40%}14%{left:130%}100%{left:130%}}
@keyframes fillx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
</helmet>
<div style="width: 1000px; height: 1080px; box-sizing: border-box; padding: 48px 72px; display: flex; gap: 76px; background: #100D09; font-family: Manrope, 'Segoe UI', system-ui, sans-serif">
<sc-for list="{{phones}}" as="p" hint-placeholder-count="2">
<div style="width: 390px; display: flex; flex-direction: column; gap: 16px; align-items: center">
<div style="width: 100%; display: flex; flex-direction: column; gap: 6px; min-height: 52px">
<div style="font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 5px; color: #F0CF86">{{p.label}}</div>
<div style="font-size: 15px; line-height: 1.5; color: #A7997F">{{p.sub}}</div>
</div>
<div style="width: 390px; height: 844px">
<sc-if value="{{p.show}}" hint-placeholder-val="{{true}}">
<div class="ph {{p.doneCls}}" style="--t: {{p.t}}">
<button class="skip" onClick="{{p.skip}}">Skip</button>
<div class="col">
<div class="win">
<div class="win-in">
<sc-if value="{{p.clip}}" hint-placeholder-val="{{true}}">
<div class="torch l lv"></div>
<div class="torch r lv"></div>
<div class="arch"></div>
<div class="rays lv"></div>
<div class="ped-top"></div>
<div class="ped"></div>
<div class="orb"></div>
</sc-if>
<sc-if value="{{p.noclip}}" hint-placeholder-val="{{false}}">
<div class="mrays lv"></div>
<div class="medal"><svg viewBox="0 0 48 48" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M18 42C8 37 4 26 9 13"></path><path d="M30 42C40 37 44 26 39 13"></path></g><g fill="currentColor"><ellipse cx="10" cy="15" rx="1.8" ry="3.6" transform="rotate(-35 10 15)"></ellipse><ellipse cx="7" cy="21.5" rx="1.8" ry="3.6" transform="rotate(-15 7 21.5)"></ellipse><ellipse cx="7.5" cy="28.5" rx="1.8" ry="3.6" transform="rotate(10 7.5 28.5)"></ellipse><ellipse cx="10.5" cy="34.5" rx="1.8" ry="3.6" transform="rotate(35 10.5 34.5)"></ellipse><ellipse cx="15.5" cy="39" rx="1.8" ry="3.6" transform="rotate(60 15.5 39)"></ellipse><ellipse cx="38" cy="15" rx="1.8" ry="3.6" transform="rotate(35 38 15)"></ellipse><ellipse cx="41" cy="21.5" rx="1.8" ry="3.6" transform="rotate(15 41 21.5)"></ellipse><ellipse cx="40.5" cy="28.5" rx="1.8" ry="3.6" transform="rotate(-10 40.5 28.5)"></ellipse><ellipse cx="37.5" cy="34.5" rx="1.8" ry="3.6" transform="rotate(-35 37.5 34.5)"></ellipse><ellipse cx="32.5" cy="39" rx="1.8" ry="3.6" transform="rotate(-60 32.5 39)"></ellipse></g></svg><span class="medal-n">III</span></div>
</sc-if>
</div>
</div>
<div>
<div class="eb a1">New rank · III of IX</div>
<div class="pre a2">You have risen to</div>
<div class="rank"><span class="rw">Sage</span></div>
<p class="ln a4">You've passed 500 points. Your seat moves up to the upper stands of the Colosseum.</p>
</div>
<div class="lad a5">
<div class="pips">
<sc-for list="{{p.pips}}" as="q" hint-placeholder-count="9">
<span class="{{q.cls}}"></span>
</sc-for>
</div>
<div class="lad-l"><span>Artisan</span><span>Olympian</span></div>
</div>
<div class="nx a6">
<div class="nx-top"><span>Next: <b>Alchemist</b> at 1,500</span><span class="nx-go">960 to go</span></div>
<div class="bar"><div class="fill" style="width: 4%"></div></div>
</div>
<div class="btns a7">
<button class="cta">See my seat</button>
<button class="sec">Share</button>
</div>
</div>
</div>
</sc-if>
</div>
<button class="rp" onClick="{{p.replay}}">Replay</button>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":1080}}'>
class Component extends DCLogic {
  replay(id) {
    const st = this.state || {};
    const h = Object.assign({}, st.hidden || {}); h[id] = true;
    const d = Object.assign({}, st.done || {}); d[id] = false;
    this.setState({ hidden: h, done: d });
    setTimeout(() => {
      const h2 = Object.assign({}, (this.state || {}).hidden || {}); h2[id] = false;
      this.setState({ hidden: h2 });
    }, 60);
  }
  skip(id) {
    const d = Object.assign({}, (this.state || {}).done || {}); d[id] = true;
    this.setState({ done: d });
  }
  renderVals() {
    const st = this.state || {};
    const hid = st.hidden || {};
    const dn = st.done || {};
    const cfgs = [
      { id: 'a', clip: true, t: '2.6s', label: 'WITH ITS GEMINI CLIP', sub: 'The relic clip plays in the gold frame (a stand-in here), then the rank is struck.' },
      { id: 'b', clip: false, t: '1.3s', label: 'BEFORE ITS CLIP EXISTS', sub: 'A struck gold medal stands in, so every rank has a ceremony from day one.' }
    ];
    const pips = [];
    for (let i = 0; i < 9; i++) {
      pips.push({ cls: 'pip ' + (i < 2 ? 'done' : (i === 2 ? 'now' : 'next')) });
    }
    const phones = cfgs.map((c) => ({
      pips: pips,
      label: c.label, sub: c.sub, t: c.t,
      clip: c.clip, noclip: !c.clip,
      show: !hid[c.id],
      doneCls: dn[c.id] ? 'done' : '',
      skip: () => this.skip(c.id),
      replay: () => this.replay(c.id)
    }));
    return { phones: phones };
  }
}
</script>
</body>
</html>
