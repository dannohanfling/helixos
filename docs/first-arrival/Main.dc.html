<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First arrival, client</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#100D09}
.ph{position:relative;width:390px;height:844px;border-radius:40px;overflow:hidden;background:#100D09;color:#F1E6CF;outline:1px solid #3A3022;font-family:Manrope,"Segoe UI",system-ui,sans-serif;box-sizing:border-box}
.stage{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}
@keyframes rise{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:none}}
@keyframes fade{0%{opacity:0}100%{opacity:1}}
@keyframes flick{0%,100%{transform:scaleY(1) scaleX(1);opacity:1}25%{transform:scaleY(1.12) scaleX(.92);opacity:.92}50%{transform:scaleY(.94) scaleX(1.05)}75%{transform:scaleY(1.08) scaleX(.96);opacity:.96}}
@keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}

/* ---------- the welcome (under the gate) ---------- */
.hero{position:relative;height:236px;overflow:hidden;background:linear-gradient(180deg,#140E09 0%,#2E1D10 26%,#6B4420 52%,#B5702E 74%,#E8A24A 88%,#F3C46E 100%)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(180deg,rgba(16,13,9,0),#100D09)}
.sun{position:absolute;left:50%;top:112px;width:300px;height:300px;margin-left:-150px;border-radius:50%;background:radial-gradient(circle,rgba(255,236,180,.9) 0%,rgba(243,196,110,.45) 22%,rgba(232,162,74,0) 58%);animation:fade 1.6s ease 2.3s both}
.sky{position:absolute;left:0;right:0;bottom:0;width:100%;height:120px;display:block}
.crest{position:absolute;left:50%;top:28px;width:168px;height:168px;margin-left:-84px;z-index:2}
.leaf{position:absolute;width:10px;height:24px;border-radius:50%;background:linear-gradient(160deg,#FBE7A6,#E8C26A 45%,#9A6526);box-shadow:0 0 6px rgba(240,207,134,.35);transform:rotate(var(--r));animation:leaf .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes leaf{0%{opacity:0;transform:rotate(var(--r)) scale(0)}100%{opacity:1;transform:rotate(var(--r)) scale(1)}}
.knot{position:absolute;left:50%;bottom:6px;width:12px;height:12px;margin-left:-6px;background:#E8C26A;transform:rotate(45deg);animation:fade .4s ease 2.9s both}
/* an aureus: a gold coin with a beaded rim */
.coinm{position:absolute;left:50%;top:50%;width:100px;height:100px;margin:-50px 0 0 -50px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#FFF1C2 0%,#F0CF86 22%,#D9A94F 55%,#9A6526 100%);box-shadow:0 0 0 2px #7A4E1C,0 0 34px rgba(255,214,130,.55),inset 0 -6px 12px rgba(90,55,18,.45);display:flex;align-items:center;justify-content:center;animation:coinin 1s cubic-bezier(.2,1.3,.4,1) 2.85s both}
.coinm::before{content:"";position:absolute;inset:6px;border-radius:50%;border:2px dotted rgba(106,74,12,.75)}
.coinm span{position:relative;font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:56px;line-height:1;color:#6A4A0C;text-shadow:0 1px 0 rgba(255,244,210,.7),0 -1px 0 rgba(80,50,10,.35)}
@keyframes coinin{0%{opacity:0;transform:scale(.3) rotateY(180deg)}100%{opacity:1;transform:scale(1) rotateY(0)}}
.txt{position:relative;z-index:2;padding:0 24px;text-align:center;margin-top:-6px}
.eb{font-size:12px;line-height:16px;letter-spacing:5px;font-weight:700;text-transform:uppercase;color:#F0CF86;animation:rise .7s ease 3s both}
.ttl{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:36px;line-height:1.05;margin:8px 0 10px;animation:rise .8s ease 3.15s both}
.lead{margin:0 auto;max-width:310px;font-size:15px;line-height:1.5;color:#A7997F;animation:rise .8s ease 3.3s both}
.chip{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:7px 14px 7px 10px;border-radius:999px;background:rgba(232,135,58,.12);border:1px solid rgba(232,135,58,.35);color:#F3B27A;font-size:13px;font-weight:700;animation:rise .7s ease 3.45s both}
.chip svg{transform-origin:50% 90%;animation:flick 1.4s ease-in-out 3.8s infinite}
.rule{display:flex;align-items:center;gap:10px;padding:16px 40px 0;animation:fade .6s ease 3.5s both}
.rule i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#5E4C27)}
.rule i:last-child{background:linear-gradient(90deg,#5E4C27,transparent)}
.rule b{width:7px;height:7px;background:#C9973F;transform:rotate(45deg)}
.steps{position:relative;z-index:2;display:flex;flex-direction:column;gap:8px;padding:14px 20px 0}
/* marble tablets */
.step{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:6px;background:linear-gradient(180deg,#241C13,#1A150F);border:1px solid #3A3022;box-shadow:inset 0 1px 0 rgba(240,207,134,.08);animation:rise .6s ease both}
.num{flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid #C9973F;color:#F0CF86;font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:18px;letter-spacing:1px}
.st h3{margin:0;font-size:15px;line-height:1.25;font-weight:700}
.st p{margin:2px 0 0;font-size:13px;line-height:1.35;color:#A7997F}
.cta{position:relative;z-index:2;padding:18px 20px 24px}
.coin{position:relative;overflow:hidden;width:100%;min-height:56px;border-radius:999px;border:1px solid #7A4E1C;background:linear-gradient(180deg,#FBE7A6 0%,#E8C26A 38%,#C9973F 72%,#9A6526 100%);color:#2A1C08;font:800 17px/1 Manrope,sans-serif;cursor:pointer;box-shadow:0 8px 24px rgba(201,151,63,.25),inset 0 1px 0 rgba(255,255,255,.5);animation:rise .7s ease 3.95s both}
.coin::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:shine 1.1s ease 4.7s both}
@keyframes shine{0%{left:-40%}100%{left:120%}}

/* controls */
.ctl{position:absolute;top:14px;right:14px;z-index:8;display:flex;gap:6px}
.cbtn{min-height:44px;min-width:44px;padding:0 14px;border-radius:999px;border:1px solid #5E4C27;background:rgba(16,13,9,.7);color:#E9DCC0;font:700 13px/1 Manrope,sans-serif;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.cbtn:hover{color:#F0CF86}

/* falling gold leaf */
.flakes{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.fl{position:absolute;top:-24px;background:linear-gradient(135deg,#FBE7A6,#C9973F);opacity:0;animation:fall linear both}
.fl.c{border-radius:2px}.fl.lf{border-radius:0 100% 0 100%}
@keyframes fall{0%{opacity:0;transform:translateY(0) rotate(0)}10%{opacity:1}85%{opacity:.9}100%{opacity:0;transform:translateY(890px) translateX(30px) rotate(540deg)}}

/* ---------- the gate: a triumphal arch ---------- */
.gate{position:absolute;inset:0;z-index:7;pointer-events:none;transform-origin:50% 560px;animation:through 1s cubic-bezier(.55,0,.35,1) 2.2s both}
@keyframes through{0%{transform:scale(1);opacity:1;visibility:visible}100%{transform:scale(3);opacity:0;visibility:hidden}}
.wall{position:absolute;inset:0;background:
 repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 43px,rgba(0,0,0,.28) 43px 44px),
 radial-gradient(ellipse at 50% 55%,#5A4630 0%,#3E3022 55%,#241B12 100%)}
.attic{position:absolute;left:16px;right:16px;top:64px;height:112px;border:1px solid rgba(0,0,0,.4);background:linear-gradient(180deg,#6E5A3E,#56452F);box-shadow:inset 0 0 0 6px rgba(0,0,0,.12),inset 0 0 0 7px rgba(240,207,134,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.cornice{position:absolute;left:8px;right:8px;top:176px;height:14px;background:linear-gradient(180deg,#7A6545,#4A3B29)}
.cornice.t{top:52px;height:12px}
.insc{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:38px;line-height:1;letter-spacing:12px;padding-left:12px;color:#2A2016;text-shadow:0 1px 0 rgba(255,230,180,.25),0 -1px 0 rgba(0,0,0,.5)}
.insc2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:16px;letter-spacing:6px;padding-left:6px;color:#2A2016;text-shadow:0 1px 0 rgba(255,230,180,.25)}
.insc,.insc2{animation:gild 1.2s ease .2s both}
@keyframes gild{0%{color:#2A2016}100%{color:#F0CF86;text-shadow:0 0 12px rgba(240,207,134,.45),0 1px 0 rgba(0,0,0,.5)}}
.col{position:absolute;top:196px;bottom:74px;width:40px}
.col.l{left:16px}.col.r{right:16px}
.col .cap{position:absolute;left:-8px;right:-8px;top:0;height:20px;background:linear-gradient(180deg,#8A7352,#5E4C35);border-radius:2px}
.col .cap::after{content:"";position:absolute;left:4px;right:4px;bottom:-6px;height:6px;background:#6E5A3E}
.col .shaft{position:absolute;left:0;right:0;top:26px;bottom:18px;background:repeating-linear-gradient(90deg,#5E4C35 0 3px,#8A7352 3px 6px,#76613F 6px 8px);box-shadow:inset 6px 0 10px rgba(0,0,0,.35),inset -6px 0 10px rgba(0,0,0,.35)}
.col .base{position:absolute;left:-6px;right:-6px;bottom:0;height:18px;background:linear-gradient(180deg,#7A6545,#4A3B29)}
.torch{position:absolute;top:330px;width:40px;height:90px}
.torch.l{left:16px}.torch.r{right:16px}
.torch .gl{position:absolute;left:50%;top:-40px;width:180px;height:180px;margin-left:-90px;border-radius:50%;background:radial-gradient(circle,rgba(255,180,90,.45),rgba(255,160,70,0) 65%);animation:breathe 1.8s ease-in-out infinite}
.torch .fla{position:absolute;left:50%;top:6px;width:18px;height:30px;margin-left:-9px;border-radius:50% 50% 45% 45% / 65% 65% 35% 35%;background:radial-gradient(ellipse at 50% 75%,#FFF4D2 0%,#FFD27A 35%,#E8873A 70%,rgba(232,135,58,0) 100%);transform-origin:50% 100%;animation:flick .9s ease-in-out infinite}
.torch .cup{position:absolute;left:50%;top:34px;width:22px;height:12px;margin-left:-11px;border-radius:0 0 11px 11px;background:linear-gradient(180deg,#C9973F,#7A4E1C)}
.torch .arm{position:absolute;left:50%;top:44px;width:4px;height:34px;margin-left:-2px;background:#7A4E1C}
.arch{position:absolute;left:74px;width:242px;top:226px;bottom:74px;border-radius:121px 121px 0 0;background:linear-gradient(180deg,#7A6545,#5E4C35);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.arch::before{content:"";position:absolute;left:0;right:0;top:0;height:121px;border-radius:121px 121px 0 0;background:repeating-conic-gradient(from -90deg at 50% 121px,rgba(0,0,0,0) 0deg 11deg,rgba(0,0,0,.35) 11deg 12deg)}
.key{position:absolute;left:50%;top:-6px;width:30px;height:36px;margin-left:-15px;background:linear-gradient(180deg,#9A8260,#6E5A3E);clip-path:polygon(0 0,100% 0,82% 100%,18% 100%);z-index:2}
.open{position:absolute;left:20px;right:20px;top:20px;bottom:0;border-radius:101px 101px 0 0;overflow:hidden;perspective:700px;background:linear-gradient(180deg,#2E1D10 0%,#7A4A22 30%,#C9853A 62%,#F3C46E 86%,#FFE2A0 100%)}
.open .sunin{position:absolute;left:50%;bottom:40px;width:260px;height:260px;margin-left:-130px;border-radius:50%;background:radial-gradient(circle,rgba(255,240,200,.95),rgba(255,214,130,.35) 30%,rgba(255,214,130,0) 62%)}
.open .sky{height:130px}
.door{position:absolute;top:0;bottom:0;width:50%;background:
 radial-gradient(circle at 50% 50%,rgba(240,207,134,.0) 0,rgba(0,0,0,0) 100%),
 linear-gradient(90deg,#3B2716,#6B4824 40%,#57391D 70%,#2E1E11);backface-visibility:hidden;z-index:3}
.door.l{left:0;transform-origin:left center;animation:openL 1.4s cubic-bezier(.55,.05,.3,1) .8s both;box-shadow:inset -2px 0 0 #1A120B}
.door.r{right:0;transform-origin:right center;animation:openR 1.4s cubic-bezier(.55,.05,.3,1) .8s both;box-shadow:inset 2px 0 0 #1A120B}
@keyframes openL{0%{transform:rotateY(0)}100%{transform:rotateY(-108deg)}}
@keyframes openR{0%{transform:rotateY(0)}100%{transform:rotateY(108deg)}}
/* studded bronze: rows of bosses */
.door::before{content:"";position:absolute;left:10px;right:10px;top:110px;bottom:14px;background:radial-gradient(circle at 50% 50%,#F0CF86 0 2.2px,#9A6526 2.6px 3.4px,rgba(0,0,0,0) 3.8px) 0 0/20px 26px;opacity:.85}
.door .rng{position:absolute;top:300px;width:30px;height:30px;border-radius:50%;border:4px solid #E8C26A;box-shadow:0 0 8px rgba(240,207,134,.4)}
.door .boss{position:absolute;top:290px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF1C2,#C9973F 60%,#7A4E1C)}
.door.l .rng{right:10px}.door.r .rng{left:10px}
.door.l .boss{right:17px}.door.r .boss{left:17px}
.seam{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;z-index:4;background:#FFF0C4;box-shadow:0 0 16px 6px rgba(255,214,130,.6);animation:seam 1.4s ease .8s both}
@keyframes seam{0%{opacity:0}15%{opacity:1}60%{opacity:0}100%{opacity:0}}
.stairs{position:absolute;left:0;right:0;bottom:0;height:74px;background:
 linear-gradient(180deg,#8A7352 0 2px,#6E5A3E 2px 24px,#7E6848 24px 26px,#5E4C35 26px 49px,#6E5A3E 49px 51px,#4A3B29 51px 74px)}

/* skip and reduced motion: show the finished screen */
.instant .gate,.instant .flakes{display:none}
.instant *{animation-duration:0s !important;animation-delay:0s !important;animation-iteration-count:1 !important}
@media (prefers-reduced-motion:reduce){.gate,.flakes{display:none}.ph *{animation:none !important}}
</style>
</helmet>
<div class="{{rootCls}}">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<pattern id="arc" x="0" y="0" width="16" height="22" patternUnits="userSpaceOnUse"><path d="M3 21V11a5 5 0 0 1 10 0v10z" fill="#F3B868" fill-opacity=".75"></path></pattern>
</defs>
</svg>
<sc-if value="{{on}}" hint-placeholder-val="{{true}}">
<div class="stage">
<div class="hero" aria-hidden="true">
<div class="sun"></div>
<svg class="sky" viewBox="0 0 390 120" preserveAspectRatio="xMidYMax slice">
<g fill="#1A120B">
<path d="M14 120V64l18-12 18 12v56z"></path><rect x="18" y="64" width="4" height="40" fill="#2A1C10"></rect>
<ellipse cx="62" cy="80" rx="6" ry="30"></ellipse><ellipse cx="74" cy="86" rx="5" ry="24"></ellipse>
<path d="M88 40Q195 20 302 40V120H88z"></path>
<ellipse cx="318" cy="82" rx="6" ry="28"></ellipse><ellipse cx="330" cy="88" rx="5" ry="22"></ellipse>
<path d="M340 120V78h50v42z"></path>
</g>
<rect x="92" y="46" width="206" height="66" fill="url(#arc)"></rect>
<g fill="#F3B868" fill-opacity=".6"><path d="M346 120v-18a5 5 0 0 1 10 0v18zM362 120v-18a5 5 0 0 1 10 0v18zM378 120v-18a5 5 0 0 1 10 0v18z"></path></g>
<rect x="0" y="112" width="390" height="8" fill="#1A120B"></rect>
</svg>
<div class="crest">
<sc-for list="{{leaves}}" as="lf" hint-placeholder-count="24">
<i class="leaf" style="{{lf.st}}"></i>
</sc-for>
<i class="knot"></i>
<div class="coinm"><span>{{initial}}</span></div>
</div>
</div>
<div class="txt">
<div class="eb">Ave · Welcome to HelixOS</div>
<h1 class="ttl">Your seat is ready, {{name}}</h1>
<p class="lead">You start as an Artisan. Every day you show up, your fire grows.</p>
<div class="chip"><svg width="16" height="16" viewBox="0 0 24 24" fill="#E8873A" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2.5 1.4-4 2.5-5.2.3 1.6 1.1 2.5 2 2.7C11 8 11 5 12 2z"></path></svg>Day 1 · Your first ember</div>
</div>
<div class="rule" aria-hidden="true"><i></i><b></b><i></i></div>
<div class="steps">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
<div class="step" style="{{s.st}}">
<span class="num">{{s.n}}</span>
<div class="st"><h3>{{s.t}}</h3><p>{{s.d}}</p></div>
</div>
</sc-for>
</div>
<div class="cta"><button class="coin">Take my seat</button></div>
</div>
<div class="flakes" aria-hidden="true">
<sc-for list="{{flakes}}" as="f" hint-placeholder-count="22">
<i class="{{f.cls}}" style="{{f.st}}"></i>
</sc-for>
</div>
<div class="gate" aria-hidden="true">
<div class="wall"></div>
<div class="cornice t"></div>
<div class="attic"><div class="insc">HELIXOS</div><div class="insc2">AVE · {{nameUp}}</div></div>
<div class="cornice"></div>
<div class="col l"><i class="cap"></i><i class="shaft"></i><i class="base"></i></div>
<div class="col r"><i class="cap"></i><i class="shaft"></i><i class="base"></i></div>
<div class="torch l"><i class="gl"></i><i class="arm"></i><i class="cup"></i><i class="fla"></i></div>
<div class="torch r"><i class="gl"></i><i class="arm"></i><i class="cup"></i><i class="fla"></i></div>
<div class="arch"><i class="key"></i>
<div class="open">
<div class="sunin"></div>
<svg class="sky" viewBox="0 0 390 120" preserveAspectRatio="xMidYMax slice">
<g fill="#1A120B">
<ellipse cx="62" cy="80" rx="6" ry="30"></ellipse><ellipse cx="74" cy="86" rx="5" ry="24"></ellipse>
<path d="M88 40Q195 20 302 40V120H88z"></path>
<ellipse cx="318" cy="82" rx="6" ry="28"></ellipse><ellipse cx="330" cy="88" rx="5" ry="22"></ellipse>
</g>
<rect x="92" y="46" width="206" height="66" fill="url(#arc)"></rect>
<rect x="0" y="112" width="390" height="8" fill="#1A120B"></rect>
</svg>
<div class="seam"></div>
<div class="door l"><i class="boss"></i><i class="rng"></i></div>
<div class="door r"><i class="boss"></i><i class="rng"></i></div>
</div>
</div>
<div class="stairs"></div>
</div>
<div class="ctl">
<button class="cbtn" onClick="{{replay}}" aria-label="Play the welcome again"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg></button>
<button class="cbtn" onClick="{{skip}}">Skip</button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"name":{"editor":"text","default":"Maya"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: true, instant: false };
  }
  renderVals() {
    var self = this;
    var name = this.props.name || 'Maya';
    function rnd(i, k) { var x = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return x - Math.floor(x); }
    var leaves = [];
    var cx = 84, cy = 84, n = 12;
    for (var i = 0; i < n; i++) {
      var a = 100 + i * (150 / (n - 1));
      var r = i % 2 === 0 ? 66 : 76;
      var tilt = i % 2 === 0 ? 18 : -18;
      var delay = (2.45 + i * 0.05).toFixed(2);
      [1, -1].forEach(function (side) {
        var ang = side === 1 ? a : 180 - a;
        var rad = ang * Math.PI / 180;
        var x = cx + r * Math.cos(rad) - 5;
        var y = cy + r * Math.sin(rad) - 12;
        var rot = side === 1 ? (a + tilt) : -(a + tilt);
        leaves.push({ st: 'left:' + x.toFixed(1) + 'px;top:' + y.toFixed(1) + 'px;--r:' + rot.toFixed(1) + 'deg;animation-delay:' + delay + 's' });
      });
    }
    var flakes = [];
    for (var j = 0; j < 22; j++) {
      var leafy = j % 3 === 0;
      var w = leafy ? 8 + Math.round(rnd(j, 1) * 4) : 4 + Math.round(rnd(j, 1) * 3);
      var h = leafy ? Math.round(w * 1.8) : Math.round(w * 1.5);
      flakes.push({
        cls: leafy ? 'fl lf' : 'fl c',
        st: 'left:' + (rnd(j, 2) * 100).toFixed(1) + '%;width:' + w + 'px;height:' + h + 'px;animation-delay:' + (2.3 + rnd(j, 3) * 2).toFixed(2) + 's;animation-duration:' + (3.8 + rnd(j, 4) * 2.4).toFixed(2) + 's'
      });
    }
    var STEPS = [
      { n: 'I', t: 'Lock in today', d: 'Pick the one thing that moves you forward.' },
      { n: 'II', t: 'Meet your Board', d: 'Ask your advisors anything about your business.' },
      { n: 'III', t: 'Set your time zone', d: 'So Office Hours and reminders show in your time.' }
    ];
    var steps = STEPS.map(function (s, k) { return { n: s.n, t: s.t, d: s.d, st: 'animation-delay:' + (3.6 + k * 0.12).toFixed(2) + 's' }; });
    return {
      on: this.state.on,
      rootCls: this.state.instant ? 'ph instant' : 'ph',
      name: name,
      nameUp: name.toUpperCase(),
      initial: name.charAt(0).toUpperCase(),
      leaves: leaves, flakes: flakes, steps: steps,
      skip: function () { self.setState({ instant: true }); },
      replay: function () {
        self.setState({ on: false, instant: false });
        setTimeout(function () { self.setState({ on: true }); }, 40);
      }
    };
  }
}
</script>
</body>
